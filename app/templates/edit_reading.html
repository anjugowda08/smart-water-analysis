{% extends 'base.html' %}{% block title %}Edit reading{% endblock %}{% block page_title %}Edit water reading{% endblock %}{% block content %}
<div class="page-intro"><div><div class="eyebrow">METER DATA MANAGEMENT</div><h1>Edit reading</h1><p class="muted">Update the meter observation. Related anomaly alerts will be recalculated.</p></div><a class="btn outline" href="{{ url_for('main.readings') }}">← Back to readings</a></div>
<div class="panel add-panel edit-panel"><form method="post" class="inline-form"><label>Date and time<input type="datetime-local" name="timestamp" value="{{ reading.timestamp.strftime('%Y-%m-%dT%H:%M') }}" required></label><label>Zone<select name="zone" required>{% for z in zones %}<option {% if reading.zone==z %}selected{% endif %}>{{ z }}</option>{% endfor %}</select></label><label>Meter ID<input name="meter_id" value="{{ reading.meter_id }}" required maxlength="60"></label><label>Consumption (L)<input type="number" name="consumption_l" min="0" step="0.01" value="{{ reading.consumption_l }}" required></label><label>Flow rate (L/min)<input type="number" name="flow_rate" min="0" step="0.001" value="{{ reading.flow_rate }}" required></label><label>Consumer type<select name="consumer_type">{% for t in ['Household','Residential Block','Commercial','Industrial'] %}<option {% if reading.consumer_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><button class="btn primary">Save changes →</button></form></div>
{% endblock %}
